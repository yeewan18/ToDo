<head>

<style>
  body { margin: 0; padding: 32px 16px 48px; background: #e4e6eb; font-family: sans-serif; color: #222; }
  h1 { text-align: center; font-size: 22px; margin: 0 0 4px; }
  p.sub { text-align: center; margin: 0 0 32px; color: #555; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 48px; align-items: flex-start; }
  figure { margin: 0; text-align: center; }
  figure h2 { margin: 0 0 16px; font-size: 20px; }
  figcaption { margin-top: 14px; font-size: 14px; color: #444; }
  figcaption small { display: block; color: #777; }

  .phone { position: relative; background: #111; box-shadow: 0 20px 40px rgba(0,0,0,.35), inset 0 0 0 2px #444; }
  .screen { position: relative; overflow: hidden; background: #000; }
  .screen iframe { display: block; border: 0; width: 100%; background: #fff; }
  .status { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center;
            color: #fff; font-size: 14px; font-weight: 600; z-index: 2; pointer-events: none; }
  .home { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: #fff; z-index: 2; opacity: .9; mix-blend-mode: difference; }

  /* iPhone 16: 393 x 852 */
  .iphone { padding: 12px; border-radius: 62px; }
  .iphone .screen { width: 393px; height: 852px; border-radius: 50px; }
  .iphone .status { height: 54px; padding: 0 34px; box-sizing: border-box; background: #000; }
  .iphone iframe { position: absolute; top: 54px; height: calc(100% - 54px - 20px); }
  .iphone .island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 120px; height: 34px; background: #000; border-radius: 20px; z-index: 3; }
  .iphone .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: #000; }

  /* Samsung Galaxy S25: 360 x 780 */
  .galaxy { padding: 9px; border-radius: 40px; }
  .galaxy .screen { width: 360px; height: 780px; border-radius: 32px; }
  .galaxy .status { height: 34px; padding: 0 22px; box-sizing: border-box; background: #000; font-size: 13px; }
  .galaxy iframe { position: absolute; top: 34px; height: calc(100% - 34px - 22px); }
  .galaxy .punch { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); width: 12px; height: 12px; background: #000; border-radius: 50%; box-shadow: 0 0 0 1px #333; z-index: 3; }
  .galaxy .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 22px; background: #000; }
  .galaxy .home { width: 100px; height: 4px; bottom: 9px; }
</style>

&lt;style&gt;
  :root {

  }

  }

  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; background: var(--bg); color: var(--fg); }

  button.icon { padding: 6px 8px; font-size: 16px; background: none; border: 1px solid transparent; border-radius: 4px; }

  #alerts .alert { display: flex; align-items: center; gap: 8px; background: var(--alert-bg); border: 1px solid var(--alert-border); padding: 8px 12px; margin-top: 12px; border-radius: 4px; }
  #alerts .alert span { flex: 1; }
  h2 { font-size: 16px; margin: 24px 0 0; color: var(--heading); }
  ul { list-style: none; padding: 0; margin: 4px 0 0; }

  li .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; }

&lt;body&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;button type=&quot;button&quot; id=&quot;theme&quot; class=&quot;icon&quot;&gt;&lt;/button&gt;
  &lt;/div&gt;
  &lt;h1&gt;To-Do&lt;/h1&gt;
  &lt;div id=&quot;alerts&quot;&gt;&lt;/div&gt;
  &lt;form id=&quot;form&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;input&quot; placeholder=&quot;New item&quot; autocomplete=&quot;off&quot;&gt;
    &lt;label class=&quot;field&quot;&gt;Category
      &lt;select id=&quot;category&quot;&gt;
        &lt;option&gt;Work&lt;/option&gt;
        &lt;option&gt;Personal&lt;/option&gt;
        &lt;option&gt;Others&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;field&quot;&gt;Priority
      &lt;select id=&quot;priority&quot;&gt;
        &lt;option&gt;High&lt;/option&gt;
        &lt;option selected&gt;Medium&lt;/option&gt;
        &lt;option&gt;Low&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;field&quot;&gt;Due date
      &lt;input type=&quot;date&quot; id=&quot;due&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;field&quot;&gt;Reminder
      &lt;input type=&quot;datetime-local&quot; id=&quot;remind&quot;&gt;
    &lt;/label&gt;
    &lt;button type=&quot;submit&quot;&gt;Add&lt;/button&gt;
  &lt;/form&gt;
  &lt;div id=&quot;list&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  const CATEGORIES = [&#39;Work&#39;, &#39;Personal&#39;, &#39;Others&#39;];
  const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

  
  
  let todos = [
    {id:1,text:&#39;Finish quarterly report&#39;,category:&#39;Work&#39;,priority:&#39;High&#39;,due:&#39;2026-11-30&#39;,remind:&#39;2026-11-29T09:00&#39;,reminded:false,done:false},
    {id:2,text:&#39;Send meeting notes to the whole team&#39;,category:&#39;Work&#39;,priority:&#39;Medium&#39;,due:&#39;&#39;,remind:&#39;&#39;,reminded:false,done:false},
    {id:3,text:&#39;Gym session&#39;,category:&#39;Personal&#39;,priority:&#39;Low&#39;,due:&#39;&#39;,remind:&#39;&#39;,reminded:false,done:false},
    {id:4,text:&#39;Call dentist&#39;,category:&#39;Personal&#39;,priority:&#39;High&#39;,due:&#39;2026-11-20&#39;,remind:&#39;&#39;,reminded:false,done:false},
    {id:5,text:&#39;Buy groceries&#39;,category:&#39;Others&#39;,priority:&#39;Medium&#39;,due:&#39;&#39;,remind:&#39;&#39;,reminded:false,done:true}
  ];
  let nextId = todos.reduce((m, t) =&gt; Math.max(m, t.id), 0) + 1;
  let editingId = null;
  let alerts = []; // reminders that have fired and not yet been dismissed

  const list = document.getElementById(&#39;list&#39;);
  const input = document.getElementById(&#39;input&#39;);
  const category = document.getElementById(&#39;category&#39;);
  const priority = document.getElementById(&#39;priority&#39;);
  const due = document.getElementById(&#39;due&#39;);
  const remind = document.getElementById(&#39;remind&#39;);

  // ----- Theme: one icon button toggles light / dark (starts from the system setting) -----
  const themeBtn = document.getElementById(&#39;theme&#39;);
  let theme = &#39;light&#39;; const sysDark = window.matchMedia &amp;&amp; matchMedia(&#39;(prefers-color-scheme: dark)&#39;).matches ? &#39;dark&#39; : &#39;light&#39;;
  try {
    const s = null;
    if (s === &#39;light&#39; || s === &#39;dark&#39;) theme = s;
  } catch (e) {}

  function applyTheme() {
    document.documentElement.setAttribute(&#39;data-theme&#39;, theme);
    // Show the icon for the mode you would switch to
    const label = theme === &#39;dark&#39; ? &#39;Switch to light mode&#39; : &#39;Switch to dark mode&#39;;
    themeBtn.textContent = theme === &#39;dark&#39; ? &#39;☀️&#39; : &#39;\u{1F319}&#39;;
    themeBtn.title = label;
    themeBtn.setAttribute(&#39;aria-label&#39;, label);
  }
  themeBtn.onclick = () =&gt; {
    theme = theme === &#39;dark&#39; ? &#39;light&#39; : &#39;dark&#39;;
    applyTheme();
    try {  } catch (e) {}
  };
  applyTheme();

  function save() {
    try {  } catch (e) {}
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + &#39;-&#39; + String(d.getMonth() + 1).padStart(2, &#39;0&#39;) + &#39;-&#39; + String(d.getDate()).padStart(2, &#39;0&#39;);
  }

  function el(tag, props) { return Object.assign(document.createElement(tag), props); }

  function iconButton(symbol, label, onclick) {
    const b = el(&#39;button&#39;, { className: &#39;icon&#39;, textContent: symbol, title: label, onclick });
    b.setAttribute(&#39;aria-label&#39;, label);
    return b;
  }

  function optionsSelect(values, selected, title) {
    const s = el(&#39;select&#39;, { title });
    values.forEach(v =&gt; s.appendChild(el(&#39;option&#39;, { textContent: v, selected: v === selected })));
    return s;
  }

  function buildItem(t) {
    const li = el(&#39;li&#39;, { className: t.done ? &#39;done&#39; : &#39;&#39; });
    const cb = el(&#39;input&#39;, { type: &#39;checkbox&#39;, checked: t.done, onchange: () =&gt; toggleTodo(t.id) });
    const del = iconButton(&#39;\u{1F5D1}️&#39;, &#39;Delete&#39;, () =&gt; deleteTodo(t.id));

    if (t.id === editingId) {
      const text = el(&#39;input&#39;, { type: &#39;text&#39;, className: &#39;edit-text&#39;, value: t.text });
      const cat = optionsSelect(CATEGORIES, t.category, &#39;Category&#39;);
      const pri = optionsSelect(Object.keys(PRIORITY_ORDER), t.priority, &#39;Priority&#39;);
      const date = el(&#39;input&#39;, { type: &#39;date&#39;, value: t.due, title: &#39;Due date&#39; });
      const rem = el(&#39;input&#39;, { type: &#39;datetime-local&#39;, value: t.remind, title: &#39;Reminder&#39; });
      const doSave = () =&gt; saveEdit(t.id, text.value, cat.value, pri.value, date.value, rem.value);
      [text, cat, pri, date, rem].forEach(i =&gt; i.onkeydown = e =&gt; {
        if (e.key === &#39;Enter&#39;) doSave();
        if (e.key === &#39;Escape&#39;) { editingId = null; render(); }
      });
      li.append(cb, text, cat, pri, date, rem, el(&#39;button&#39;, { textContent: &#39;Save&#39;, onclick: doSave }), del);
      setTimeout(() =&gt; text.focus());
    } else {
      li.append(cb, el(&#39;span&#39;, { className: &#39;text&#39;, textContent: t.text }));
      li.append(el(&#39;span&#39;, { className: &#39;badge &#39; + t.priority, textContent: t.priority }));
      if (t.due) {
        const overdue = !t.done &amp;&amp; t.due &lt; today();
        li.append(el(&#39;span&#39;, { className: &#39;meta&#39; + (overdue ? &#39; overdue&#39; : &#39;&#39;), textContent: (overdue ? &#39;Overdue: &#39; : &#39;Due: &#39;) + t.due }));
      }
      if (t.remind) {
        li.append(el(&#39;span&#39;, { className: &#39;meta&#39;, textContent: &#39;\u{1F514} &#39; + t.remind.replace(&#39;T&#39;, &#39; &#39;) }));
      }
      li.append(iconButton(&#39;✏️&#39;, &#39;Edit&#39;, () =&gt; { editingId = t.id; render(); }), del);
    }
    return li;
  }

  function renderAlerts() {
    const box = document.getElementById(&#39;alerts&#39;);
    box.innerHTML = &#39;&#39;;
    alerts.forEach(a =&gt; {
      const row = el(&#39;div&#39;, { className: &#39;alert&#39; });
      row.append(
        el(&#39;span&#39;, { textContent: &#39;\u{1F514} Reminder: &#39; + a.text }),
        el(&#39;button&#39;, { textContent: &#39;Dismiss&#39;, onclick: () =&gt; { alerts = alerts.filter(x =&gt; x !== a); renderAlerts(); } })
      );
      box.appendChild(row);
    });
  }

  // Browser notification (only if the user allowed it); the banner is always shown too
  function notify(text) {
    try {
      if (&#39;Notification&#39; in window &amp;&amp; Notification.permission === &#39;granted&#39;) {
        new Notification(&#39;To-Do reminder&#39;, { body: text });
      }
    } catch (e) {}
  }

  function askNotificationPermission() {
    try {
      if (&#39;Notification&#39; in window &amp;&amp; Notification.permission === &#39;default&#39;) Notification.requestPermission();
    } catch (e) {}
  }

  // Fire any reminders whose time has arrived (and that are not done / not yet fired)
  function checkReminders() {
    const now = new Date();
    let fired = false;
    todos.forEach(t =&gt; {
      if (t.remind &amp;&amp; !t.reminded &amp;&amp; !t.done &amp;&amp; new Date(t.remind) &lt;= now) {
        t.reminded = true;
        alerts.push({ text: t.text });
        notify(t.text);
        fired = true;
      }
    });
    if (fired) { save(); renderAlerts(); }
  }

  function byDue(a, b) {
    const x = a.due || &#39;9999&#39;, y = b.due || &#39;9999&#39;;
    return x &lt; y ? -1 : x &gt; y ? 1 : a.id - b.id;
  }

  function render() {
    save();
    // One section per category (fixed order); within a section: priority, then due date
    list.innerHTML = &#39;&#39;;
    CATEGORIES.forEach(name =&gt; {
      const items = todos.filter(t =&gt; t.category === name);
      if (!items.length) return;
      list.appendChild(el(&#39;h2&#39;, { textContent: name }));
      const ul = el(&#39;ul&#39;);
      items
        .sort((a, b) =&gt; (PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]) || byDue(a, b))
        .forEach(t =&gt; ul.appendChild(buildItem(t)));
      list.appendChild(ul);
    });
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      id: nextId++, text, category: category.value, priority: priority.value,
      due: due.value, remind: remind.value, reminded: false, done: false
    });
    if (remind.value) askNotificationPermission();
    input.value = &#39;&#39;;
    due.value = &#39;&#39;;
    remind.value = &#39;&#39;;
    render();
    checkReminders();
  }

  function saveEdit(id, text, cat, pri, date, rem) {
    const t = todos.find(t =&gt; t.id === id);
    if (t &amp;&amp; text.trim()) {
      t.text = text.trim();
      t.category = cat;
      t.priority = pri;
      t.due = date;
      if (rem !== t.remind) t.reminded = false; // new reminder time: allow it to fire again
      t.remind = rem;
      if (rem) askNotificationPermission();
    }
    editingId = null;
    render();
    checkReminders();
  }

  function toggleTodo(id) {
    const t = todos.find(t =&gt; t.id === id);
    if (t) t.done = !t.done;
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t =&gt; t.id !== id);
    render();
  }

  // Older saved items may lack the new fields or use a category that no longer exists
  todos.forEach(t =&gt; {
    if (!PRIORITY_ORDER.hasOwnProperty(t.priority)) t.priority = &#39;Medium&#39;;
    if (!CATEGORIES.includes(t.category)) t.category = &#39;Others&#39;;
    t.remind = t.remind || &#39;&#39;;
    t.due = t.due || &#39;&#39;;
  });

  document.getElementById(&#39;form&#39;).onsubmit = e =&gt; { e.preventDefault(); addTodo(); };
  render();
  checkReminders();
  setInterval(checkReminders, 15000);
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;

  h2 { font-size: 16px; margin: 24px 0 0; color: var(--heading); }
  ul { list-style: none; padding: 0; margin: 4px 0 0; }
  li { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  li .text { flex: 1; min-width: 120px; }
  li .meta { font-size: 13px; color: var(--muted); }
  li .meta.overdue { color: var(--overdue); font-weight: bold; }
  li .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; color: #fff; }
  .badge.High { background: #d33; }
  .badge.Medium { background: #e08a00; }
  .badge.Low { background: #4c9a6a; }
  li.done .text { text-decoration: line-through; color: var(--done); }
  li.done .meta { color: var(--faint); font-weight: normal; }
  li.done .badge { opacity: .5; }
  li .edit-text { flex: 1 1 100%; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div class=&quot;topbar&quot;&gt;
    &lt;button type=&quot;button&quot; id=&quot;theme&quot; class=&quot;icon&quot;&gt;&lt;/button&gt;
  &lt;/div&gt;
  &lt;h1&gt;To-Do&lt;/h1&gt;
  &lt;div id=&quot;alerts&quot;&gt;&lt;/div&gt;
  &lt;form id=&quot;form&quot;&gt;
    &lt;input type=&quot;text&quot; id=&quot;input&quot; placeholder=&quot;New item&quot; autocomplete=&quot;off&quot;&gt;
    &lt;label class=&quot;field&quot;&gt;Category
      &lt;select id=&quot;category&quot;&gt;
        &lt;option&gt;Work&lt;/option&gt;
        &lt;option&gt;Personal&lt;/option&gt;
        &lt;option&gt;Others&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;field&quot;&gt;Priority
      &lt;select id=&quot;priority&quot;&gt;
        &lt;option&gt;High&lt;/option&gt;
        &lt;option selected&gt;Medium&lt;/option&gt;
        &lt;option&gt;Low&lt;/option&gt;
      &lt;/select&gt;
    &lt;/label&gt;
    &lt;label class=&quot;field&quot;&gt;Due date
      &lt;input type=&quot;date&quot; id=&quot;due&quot;&gt;
    &lt;/label&gt;
    &lt;label class=&quot;field&quot;&gt;Reminder
      &lt;input type=&quot;datetime-local&quot; id=&quot;remind&quot;&gt;
    &lt;/label&gt;
    &lt;button type=&quot;submit&quot;&gt;Add&lt;/button&gt;
  &lt;/form&gt;
  &lt;div id=&quot;list&quot;&gt;&lt;/div&gt;

&lt;script&gt;
  const CATEGORIES = [&#39;Work&#39;, &#39;Personal&#39;, &#39;Others&#39;];
  const PRIORITY_ORDER = { High: 0, Medium: 1, Low: 2 };

  
  
  let todos = [
    {id:1,text:&#39;Finish quarterly report&#39;,category:&#39;Work&#39;,priority:&#39;High&#39;,due:&#39;2026-11-30&#39;,remind:&#39;2026-11-29T09:00&#39;,reminded:false,done:false},
    {id:2,text:&#39;Send meeting notes to the whole team&#39;,category:&#39;Work&#39;,priority:&#39;Medium&#39;,due:&#39;&#39;,remind:&#39;&#39;,reminded:false,done:false},
    {id:3,text:&#39;Gym session&#39;,category:&#39;Personal&#39;,priority:&#39;Low&#39;,due:&#39;&#39;,remind:&#39;&#39;,reminded:false,done:false},
    {id:4,text:&#39;Call dentist&#39;,category:&#39;Personal&#39;,priority:&#39;High&#39;,due:&#39;2026-11-20&#39;,remind:&#39;&#39;,reminded:false,done:false},
    {id:5,text:&#39;Buy groceries&#39;,category:&#39;Others&#39;,priority:&#39;Medium&#39;,due:&#39;&#39;,remind:&#39;&#39;,reminded:false,done:true}
  ];
  let nextId = todos.reduce((m, t) =&gt; Math.max(m, t.id), 0) + 1;
  let editingId = null;
  let alerts = []; // reminders that have fired and not yet been dismissed

  const list = document.getElementById(&#39;list&#39;);
  const input = document.getElementById(&#39;input&#39;);
  const category = document.getElementById(&#39;category&#39;);
  const priority = document.getElementById(&#39;priority&#39;);
  const due = document.getElementById(&#39;due&#39;);
  const remind = document.getElementById(&#39;remind&#39;);

  // ----- Theme: one icon button toggles light / dark (starts from the system setting) -----
  const themeBtn = document.getElementById(&#39;theme&#39;);
  let theme = &#39;dark&#39;; const sysDark = window.matchMedia &amp;&amp; matchMedia(&#39;(prefers-color-scheme: dark)&#39;).matches ? &#39;dark&#39; : &#39;light&#39;;
  try {
    const s = null;
    if (s === &#39;light&#39; || s === &#39;dark&#39;) theme = s;
  } catch (e) {}

  function applyTheme() {
    document.documentElement.setAttribute(&#39;data-theme&#39;, theme);
    // Show the icon for the mode you would switch to
    const label = theme === &#39;dark&#39; ? &#39;Switch to light mode&#39; : &#39;Switch to dark mode&#39;;
    themeBtn.textContent = theme === &#39;dark&#39; ? &#39;☀️&#39; : &#39;\u{1F319}&#39;;
    themeBtn.title = label;
    themeBtn.setAttribute(&#39;aria-label&#39;, label);
  }
  themeBtn.onclick = () =&gt; {
    theme = theme === &#39;dark&#39; ? &#39;light&#39; : &#39;dark&#39;;
    applyTheme();
    try {  } catch (e) {}
  };
  applyTheme();

  function save() {
    try {  } catch (e) {}
  }

  function today() {
    const d = new Date();
    return d.getFullYear() + &#39;-&#39; + String(d.getMonth() + 1).padStart(2, &#39;0&#39;) + &#39;-&#39; + String(d.getDate()).padStart(2, &#39;0&#39;);
  }

  function el(tag, props) { return Object.assign(document.createElement(tag), props); }

  function iconButton(symbol, label, onclick) {
    const b = el(&#39;button&#39;, { className: &#39;icon&#39;, textContent: symbol, title: label, onclick });
    b.setAttribute(&#39;aria-label&#39;, label);
    return b;
  }

  function optionsSelect(values, selected, title) {
    const s = el(&#39;select&#39;, { title });
    values.forEach(v =&gt; s.appendChild(el(&#39;option&#39;, { textContent: v, selected: v === selected })));
    return s;
  }

  function buildItem(t) {
    const li = el(&#39;li&#39;, { className: t.done ? &#39;done&#39; : &#39;&#39; });
    const cb = el(&#39;input&#39;, { type: &#39;checkbox&#39;, checked: t.done, onchange: () =&gt; toggleTodo(t.id) });
    const del = iconButton(&#39;\u{1F5D1}️&#39;, &#39;Delete&#39;, () =&gt; deleteTodo(t.id));

    if (t.id === editingId) {
      const text = el(&#39;input&#39;, { type: &#39;text&#39;, className: &#39;edit-text&#39;, value: t.text });
      const cat = optionsSelect(CATEGORIES, t.category, &#39;Category&#39;);
      const pri = optionsSelect(Object.keys(PRIORITY_ORDER), t.priority, &#39;Priority&#39;);
      const date = el(&#39;input&#39;, { type: &#39;date&#39;, value: t.due, title: &#39;Due date&#39; });
      const rem = el(&#39;input&#39;, { type: &#39;datetime-local&#39;, value: t.remind, title: &#39;Reminder&#39; });
      const doSave = () =&gt; saveEdit(t.id, text.value, cat.value, pri.value, date.value, rem.value);
      [text, cat, pri, date, rem].forEach(i =&gt; i.onkeydown = e =&gt; {
        if (e.key === &#39;Enter&#39;) doSave();
        if (e.key === &#39;Escape&#39;) { editingId = null; render(); }
      });
      li.append(cb, text, cat, pri, date, rem, el(&#39;button&#39;, { textContent: &#39;Save&#39;, onclick: doSave }), del);
      setTimeout(() =&gt; text.focus());
    } else {
      li.append(cb, el(&#39;span&#39;, { className: &#39;text&#39;, textContent: t.text }));
      li.append(el(&#39;span&#39;, { className: &#39;badge &#39; + t.priority, textContent: t.priority }));
      if (t.due) {
        const overdue = !t.done &amp;&amp; t.due &lt; today();
        li.append(el(&#39;span&#39;, { className: &#39;meta&#39; + (overdue ? &#39; overdue&#39; : &#39;&#39;), textContent: (overdue ? &#39;Overdue: &#39; : &#39;Due: &#39;) + t.due }));
      }
      if (t.remind) {
        li.append(el(&#39;span&#39;, { className: &#39;meta&#39;, textContent: &#39;\u{1F514} &#39; + t.remind.replace(&#39;T&#39;, &#39; &#39;) }));
      }
      li.append(iconButton(&#39;✏️&#39;, &#39;Edit&#39;, () =&gt; { editingId = t.id; render(); }), del);
    }
    return li;
  }

  function renderAlerts() {
    const box = document.getElementById(&#39;alerts&#39;);
    box.innerHTML = &#39;&#39;;
    alerts.forEach(a =&gt; {
      const row = el(&#39;div&#39;, { className: &#39;alert&#39; });
      row.append(
        el(&#39;span&#39;, { textContent: &#39;\u{1F514} Reminder: &#39; + a.text }),
        el(&#39;button&#39;, { textContent: &#39;Dismiss&#39;, onclick: () =&gt; { alerts = alerts.filter(x =&gt; x !== a); renderAlerts(); } })
      );
      box.appendChild(row);
    });
  }

  // Browser notification (only if the user allowed it); the banner is always shown too
  function notify(text) {
    try {
      if (&#39;Notification&#39; in window &amp;&amp; Notification.permission === &#39;granted&#39;) {
        new Notification(&#39;To-Do reminder&#39;, { body: text });
      }
    } catch (e) {}
  }

  function askNotificationPermission() {
    try {
      if (&#39;Notification&#39; in window &amp;&amp; Notification.permission === &#39;default&#39;) Notification.requestPermission();
    } catch (e) {}
  }

  // Fire any reminders whose time has arrived (and that are not done / not yet fired)
  function checkReminders() {
    const now = new Date();
    let fired = false;
    todos.forEach(t =&gt; {
      if (t.remind &amp;&amp; !t.reminded &amp;&amp; !t.done &amp;&amp; new Date(t.remind) &lt;= now) {
        t.reminded = true;
        alerts.push({ text: t.text });
        notify(t.text);
        fired = true;
      }
    });
    if (fired) { save(); renderAlerts(); }
  }

  function byDue(a, b) {
    const x = a.due || &#39;9999&#39;, y = b.due || &#39;9999&#39;;
    return x &lt; y ? -1 : x &gt; y ? 1 : a.id - b.id;
  }

  function render() {
    save();
    // One section per category (fixed order); within a section: priority, then due date
    list.innerHTML = &#39;&#39;;
    CATEGORIES.forEach(name =&gt; {
      const items = todos.filter(t =&gt; t.category === name);
      if (!items.length) return;
      list.appendChild(el(&#39;h2&#39;, { textContent: name }));
      const ul = el(&#39;ul&#39;);
      items
        .sort((a, b) =&gt; (PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]) || byDue(a, b))
        .forEach(t =&gt; ul.appendChild(buildItem(t)));
      list.appendChild(ul);
    });
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      id: nextId++, text, category: category.value, priority: priority.value,
      due: due.value, remind: remind.value, reminded: false, done: false
    });
    if (remind.value) askNotificationPermission();
    input.value = &#39;&#39;;
    due.value = &#39;&#39;;
    remind.value = &#39;&#39;;
    render();
    checkReminders();
  }

  function saveEdit(id, text, cat, pri, date, rem) {
    const t = todos.find(t =&gt; t.id === id);
    if (t &amp;&amp; text.trim()) {
      t.text = text.trim();
      t.category = cat;
      t.priority = pri;
      t.due = date;
      if (rem !== t.remind) t.reminded = false; // new reminder time: allow it to fire again
      t.remind = rem;
      if (rem) askNotificationPermission();
    }
    editingId = null;
    render();
    checkReminders();
  }

  function toggleTodo(id) {
    const t = todos.find(t =&gt; t.id === id);
    if (t) t.done = !t.done;
    render();
  }

  function deleteTodo(id) {
    todos = todos.filter(t =&gt; t.id !== id);
    render();
  }

  // Older saved items may lack the new fields or use a category that no longer exists
  todos.forEach(t =&gt; {
    if (!PRIORITY_ORDER.hasOwnProperty(t.priority)) t.priority = &#39;Medium&#39;;
    if (!CATEGORIES.includes(t.category)) t.category = &#39;Others&#39;;
    t.remind = t.remind || &#39;&#39;;
    t.due = t.due || &#39;&#39;;
  });

  document.getElementById(&#39;form&#39;).onsubmit = e =&gt; { e.preventDefault(); addTodo(); };
  render();
  checkReminders();
  setInterval(checkReminders, 15000);
&lt;/script&gt;
&lt;/body&gt;
&lt;/html&gt;
"></iframe>
          <div class="home"></div>
        </div>
      </div>
      <figcaption>360 &times; 780 &middot; dark mode</figcaption>
    </figure>
  </div>
  <script>
    // Shrink the phones to fit narrow windows
    function fit() {
      document.querySelectorAll('.phone').forEach(function (p) {
        p.style.zoom = 1;
        var w = p.offsetWidth, avail = window.innerWidth - 32;
        p.style.zoom = w > avail ? avail / w : 1;
      });
    }
    window.addEventListener('resize', fit);
    fit();
  </script>
